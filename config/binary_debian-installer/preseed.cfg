# =====================================================================
# CDOS preseed configuration
#
# Sólo se preseedan las respuestas que queremos automatizar. Todo
# lo demás (idioma, teclado, zona horaria, particionado, creación
# del usuario, y selección de tareas tasksel) se pregunta
# interactivamente al usuario.
# =====================================================================

# --- Mirror: saltar la selección de país, usar deb.debian.org ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- APT: habilitar security y updates automáticamente ---
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

# --- Popularity contest: no participar ---
popularity-contest popularity-contest/participate boolean false

# --- GRUB: instalar sin preguntar, en el MBR del primer disco ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
